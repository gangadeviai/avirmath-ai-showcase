# AVIRMATH AI lesson file — shared representation for website, experiments and video.
# {placeholders} are filled from avirmath.mathcore.matrices.lesson_facts() at build time.
# v2 (2026-10-12): history chapter removed; the video opens inside a neural-network layer and ends
# inside GPT-2, a CT image, web search, a recommender and LoRA fine-tuning.

id: matrices-transformations
title: "Matrices in AI: The Linear Algebra Inside Every Neural Network Layer, Attention Head and Recommender"
version: 2
mathcore: avirmath.mathcore.matrices

one_idea: >
  Every layer of a neural network is a matrix, and a matrix is a machine that moves all of space at
  once: its columns say where the basis arrows land, multiplying matrices is doing one move after
  another, the determinant is how much area the move scales, and eigenvectors are the directions it
  only stretches. Attention, images, web ranking, recommendation and cheap fine-tuning are all the
  same machine at scale.

audience:
  profile: {level: engineer, field: general}

analogy:
  name: "none: the moving grid is the picture"
  mapping: {"the grid after M": "the image of the plane", "the columns": "where i-hat and j-hat land"}
  breaks_when: "A real layer has thousands of columns; you cannot draw them, but every statement here still holds."

voice:
  engine: edge-tts
  name: en-GB-SoniaNeural
  rate: "+10%"

colors:
  parameter: QUERY
  loss: KEY
  gradient: NEGATIVE
  learning_rate: WEIGHT
  optimum: VALUE

seo:
  primary_question: "How are matrices used in AI?"
  short_answer: >
    Every layer of a neural network is a matrix times the input vector plus a bias; attention computes
    all query-key dot products at once as Q times K transpose; an image is a matrix of pixel values and
    a convolution is a matrix product in disguise. A matrix is best understood as a linear
    transformation that moves the whole space, with its columns recording where the basis vectors
    land; matrix multiplication composes transformations, the determinant measures how area scales,
    and eigenvectors are the directions a matrix only stretches, which is what limits the learning
    rate. Google's PageRank is an eigenvector, Netflix-style recommenders factorise the user-by-film
    matrix, and LoRA fine-tunes large language models with low-rank matrices.
  keywords: [matrices in machine learning, linear algebra for deep learning, matrix multiplication neural network,
             how attention works QK transpose, matrix as linear transformation, eigenvectors eigenvalues learning rate,
             determinant explained, GPT-2 layer dimensions, LoRA low-rank adaptation explained, singular value decomposition
             recommender system, PageRank eigenvector, convolution as matrix multiplication, math behind AI,
             machine learning mathematics]
  faq:
    - q: "How are matrices used in neural networks?"
      a: "Each layer computes W times x plus b: a weight matrix times the input vector. GPT-2's feed-forward layers are 768-by-3072 matrices, about 2.4 million learned numbers each, and the model's 124 million parameters are a few hundred such matrices."
    - q: "How does attention use matrices?"
      a: "Stack the queries as rows of Q and the keys as rows of K; Q times K transpose gives every query-key dot product in one product, a token-by-token grid of scores. Each of the 12 heads in a GPT-2 layer does this in parallel on the GPU."
    - q: "What does a matrix do to a vector?"
      a: "It mixes the vector's coordinates with the matrix's columns: the result is the first coordinate times the first column plus the second coordinate times the second column. Geometrically, the whole space moves and the vector moves with it."
    - q: "Why is matrix multiplication done the way it is?"
      a: "Because multiplying two matrices is the same as applying one transformation and then the other. The row-times-column rule is exactly what composition requires, and that is also why the order matters."
    - q: "What are eigenvectors and why do they matter for training?"
      a: "Directions the matrix does not turn, only stretches; the stretch factor is the eigenvalue. For a loss surface they are the principal curvatures, and the largest eigenvalue sets the maximum safe learning rate."
    - q: "What is LoRA?"
      a: "Low-rank adaptation: instead of updating a full 768-by-768 weight matrix (589,824 numbers), learn two thin matrices of rank 8 (12,288 numbers), 48 times fewer. Any matrix can be approximated by a sum of a few rank-one layers, which is the same idea behind image compression and recommender systems."
    - q: "Where else are matrices used in industry?"
      a: "Google's PageRank is the principal eigenvector of the web's link matrix; Netflix-style recommenders factorise the user-by-film ratings matrix into two thin ones; every CT slice is a 512-by-512 matrix that a convolutional network reads as matrix products."
  sources:
    - "A. Radford et al., Language Models are Unsupervised Multitask Learners (GPT-2), 2019: 12 layers, 768-dimensional, 12 heads, 124M parameters"
    - "E. J. Hu et al., LoRA: Low-Rank Adaptation of Large Language Models, 2021"
    - "S. Brin and L. Page, The anatomy of a large-scale hypertextual Web search engine, 1998 (PageRank)"
    - "Netflix Prize, 2006-2009: 100.48 M ratings, 480,189 users, 17,770 films; RMSE 0.9514 to 0.8572"
    - "A. Vaswani et al., Attention Is All You Need, 2017 (scaled dot-product attention)"

equations:
  - id: mv
    tex: 'M\mathbf{v} = v_1\,\mathbf{m}_1 + v_2\,\mathbf{m}_2'
    checked_by: test_matrix_vector_is_a_combination_of_columns
  - id: linear
    tex: 'M(a\mathbf{u} + b\mathbf{v}) = aM\mathbf{u} + bM\mathbf{v}'
    checked_by: test_linearity
  - id: compose
    tex: '(BA)\mathbf{v} = B(A\mathbf{v}), \qquad BA \ne AB'
    checked_by: test_composition_is_matrix_product_and_order_matters
  - id: det
    tex: '\det M = ad - bc = \text{area factor}'
    checked_by: test_determinant_is_the_area_factor
  - id: eigen
    tex: 'A\mathbf{v} = \lambda\mathbf{v}'
    checked_by: test_eigenpairs_of_the_worked_symmetric_matrix
  - id: charpoly
    tex: '\det(A - \lambda I) = 0'
    checked_by: test_eigenvalues_symbolically
  - id: lrlimit
    tex: '\eta < \frac{2}{\lambda_{\max}(H)}'
    checked_by: test_bowl_curvatures_are_hessian_eigenvalues_and_set_the_lr_limit
  - id: layer
    tex: '\mathbf{h} = W\mathbf{x} + \mathbf{b}, \qquad \text{scores} = \frac{QK^{\top}}{\sqrt{d}}'
    checked_by: test_layer_and_attention_matrix
  - id: pagerank
    tex: 'G\mathbf{p} = \mathbf{p}, \qquad G = dM + \frac{1-d}{n}\mathbf{1}\mathbf{1}^{\top}'
    checked_by: test_pagerank_is_the_fixed_point_of_the_google_matrix
  - id: svd
    tex: 'M \approx \sum_{i=1}^{k} \sigma_i\, \mathbf{u}_i \mathbf{v}_i^{\top}'
    checked_by: test_low_rank_error_decreases_and_matches_discarded_singular_values
  - id: lora
    tex: '\Delta W = B A, \qquad B \in \mathbb{R}^{d \times r},\ A \in \mathbb{R}^{r \times d},\ r \ll d'
    checked_by: test_lora_storage_saving

chapters:
  - id: hook
    title: "The matrix inside every layer"
    scene: HookMat
    beats:
      - id: hook-1
        cue: layer
        narration: >
          Inside every neural network, between one layer and the next, sits a matrix. A vector of
          activations goes in, the matrix moves it, and a new vector comes out. GPT-two is a stack of
          hundreds of them; the model reading a C.T. scan is a stack of them too. So what does a matrix
          actually do? Not a table of numbers. A machine that moves all of space at once. Feed it the
          whole plane, and the whole plane moves, with grid lines staying straight and evenly spaced.
      - id: hook-2
        cue: columns
        narration: >
          And the machine is easy to read. Its first column is where the arrow one, zero lands. Its
          second column is where zero, one lands. Know those two, and you know where everything goes.

  - id: mv
    title: "A matrix times a vector"
    scene: MatVec
    beats:
      - id: mv-1
        cue: setup
        equations: [mv]
        narration: >
          Take the matrix with rows two, one, and zero, one. Its columns are two, zero, and one, one.
          Apply it to the vector one, two. The rule says: one times the first column, plus two times
          the second column.
      - id: mv-2
        cue: compute
        narration: >
          One times two, zero, is two, zero. Two times one, one, is two, two. Add them: four, two. That
          is where the vector lands. Watch the grid move with it: the x direction stretches to twice
          its length, and the y direction leans to the right.
      - id: mv-3
        cue: linear
        equations: [linear]
        narration: >
          The one property that makes all of this work is linearity. The matrix of a sum is the sum
          of the matrices. Scale the input, and the output scales. That is why the grid lines stay
          straight, and why the two columns are enough.

  - id: compose
    title: "Multiplication is composition"
    scene: ComposeMat
    beats:
      - id: comp-1
        cue: two_moves
        equations: [compose]
        narration: >
          Now do two moves in a row. First stretch x by two. Then rotate by ninety degrees. There is a
          single matrix that does both at once, and it is the product: the rotation matrix, times the
          stretch matrix. Read right to left, like functions.
      - id: comp-2
        cue: worked
        narration: >
          Multiply them out. The rotation is zero, minus one, one, zero. The stretch is two, zero,
          zero, one. Row times column: zero, minus one; two, zero. That single matrix sends the grid
          exactly where the two moves did.
      - id: comp-3
        cue: order
        narration: >
          Swap the order, rotate first and then stretch, and you get a different matrix: zero, minus
          two; one, zero. The grids do not match. Matrix multiplication does not commute, because
          doing things in a different order is a different thing. That is why a network's layers
          cannot be reordered.

  - id: det
    title: "Determinant and inverse"
    scene: DetMat
    beats:
      - id: det-1
        cue: area
        equations: [det]
        narration: >
          How much does the machine stretch area? Follow the unit square. Under our matrix it becomes
          a parallelogram of area two. That number has a formula, a d minus b c, and a name: the
          determinant. Here, two times one, minus one times zero. Two.
      - id: det-2
        cue: zero
        narration: >
          If the determinant is zero, the square is squashed flat onto a line. Area gone. And once it
          is gone, nothing can bring it back: a matrix with determinant zero has no inverse. For any
          other, the inverse is the machine run backwards, and it returns every point home.

  - id: eigen
    title: "Eigenvectors: the directions that only stretch"
    scene: EigenMat
    beats:
      - id: eig-1
        cue: special
        equations: [eigen]
        narration: >
          Most arrows get turned by a matrix. A few do not. They stay on their own line and only get
          longer or shorter. Those are the eigenvectors, and the stretch factor is the eigenvalue. A
          times v equals lambda times v.
      - id: eig-2
        cue: worked
        equations: [charpoly]
        narration: >
          Take the symmetric matrix two, one, one, two. To find lambda, ask when A minus lambda I
          squashes space: its determinant must be zero. Two minus lambda, squared, minus one, equals
          zero. So lambda is three, or one. For three, the direction one, one: the matrix sends it to
          three, three. For one, the direction one, minus one, which it leaves alone.
      - id: eig-3
        cue: bowl
        equations: [lrlimit]
        narration: >
          Here is why this matters for training. The bowl from lesson one, x squared plus three y
          squared, has a matrix of second derivatives: two, zero, zero, six. Its eigenvalues are the
          curvatures along the eigenvector directions: two along x, six along y. And the steepest
          curvature sets the learning-rate limit we found then: two divided by six, one third. The
          exact same number, from the eigenvalue.

  - id: ai
    title: "Inside a neural network and a Transformer"
    scene: AIMat
    beats:
      - id: ai-1
        cue: layer
        equations: [layer]
        narration: >
          Every layer of a neural network is a matrix. The input vector goes in, W times x plus b
          comes out, and training is gradient descent on the entries of W. In GPT-two, each of the
          {gpt2_layers} layers holds a matrix of {gpt2_d} by {gpt2_mlp}: {gpt2_layer_numbers:,}
          learned numbers in one matrix, and {gpt2_params_m} million parameters in all.
      - id: ai-2
        cue: attention
        narration: >
          Attention is a matrix product too. Stack the query vectors as rows of Q, the key vectors as
          rows of K, and Q times K transpose computes every query-key dot product at once: a thousand
          tokens give a thousand by thousand grid of scores in one operation. That is why it runs so
          fast on a graphics processor, and why the {gpt2_heads} heads of each layer can run side by side.
      - id: ai-3
        cue: image
        narration: >
          And the data itself is a matrix. A chest C.T. slice is {ct_px} by {ct_px} numbers,
          {ct_numbers:,} pixel intensities. A convolution slides a small matrix across it, and the
          library rewrites that as one big matrix product, so the same hardware that trains GPT-two
          reads the scan.

  - id: industry
    title: "Industry: search, recommendation and cheap fine-tuning"
    scene: IndustryMat
    beats:
      - id: ind-1
        cue: pagerank
        equations: [pagerank]
        narration: >
          Google ranks web pages with an eigenvector. Build a matrix where each page passes its
          importance to the pages it links to, add a little damping, and the ranking is the vector
          that the matrix sends to itself. Apply the matrix again and again, and any starting guess
          settles onto it. Here, six pages: page three is linked by everyone, and the eigenvector
          says so.
      - id: ind-2
        cue: netflix
        equations: [svd]
        narration: >
          Recommendation is a matrix problem. Netflix's prize dataset had {nf_ratings_m:g} million
          ratings from {nf_users:,} users of {nf_movies:,} films: a table of {nf_cells_b:g} billion
          cells with only {nf_filled_pct:g} percent filled. The winning idea was to write the giant
          table as a product of two thin ones, users times hidden tastes, and tastes times films. Any
          matrix splits this way, into a sum of simple layers, each a column times a row, weighted by
          a singular value.
      - id: ind-3
        cue: lowrank
        equations: [lora]
        narration: >
          Keep the biggest few layers and you keep most of the structure. Here is a forty-eight by
          forty-eight image: {storage_full:,} numbers. Six layers rebuild it with {storage_low:,}. The
          same trick, called LoRA, is how large language models are fine-tuned today: instead of
          changing a {gpt2_d} by {gpt2_d} weight matrix, {lora_full:,} numbers, you learn two thin
          matrices of rank {lora_r}, {lora_numbers:,} numbers, {lora_ratio} times fewer.

  - id: recap
    title: "Recap: what, where in AI, and how to use it"
    scene: RecapMat
    beats:
      - id: recap-1
        cue: what
        narration: >
          So. A matrix moves space; its columns say where the basis lands. Multiplying matrices is
          composing moves, and order matters. The determinant is the area factor. Eigenvectors are
          the directions that only stretch, and their eigenvalues are the curvatures that limit how
          fast you can learn.
      - id: recap-2
        cue: where_how
        narration: >
          Where in A.I.? Every layer is a matrix, attention is a matrix product, every image is a
          matrix, and fine-tuning is a low-rank matrix. How to use it: read a matrix by its columns,
          check the determinant before you invert, and let the largest eigenvalue set your learning
          rate. Next: softmax and cross-entropy, how a model turns scores into probabilities.
