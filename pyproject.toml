[project]
name = "avirmath-showcase"
version = "0.1.0"
description = "AVIRMATH AI showcase: lesson files, verified mathematics modules and their tests"
requires-python = ">=3.11"
dependencies = ["numpy", "sympy", "pyyaml", "jsonschema"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avirmath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
