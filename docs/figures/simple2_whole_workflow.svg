   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111827" x="60.21" y="118.825128" transform="rotate(-0 60.21 118.825128)">Founder</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(22.126172 131.238917)">picks a topic from the</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(20.282656 139.638917)">catalogue, or a learner</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(24.675156 148.038917)">pays for a new topic</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111827" x="173.205" y="118.825128" transform="rotate(-0 173.205 118.825128)">Lesson factory</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(131.243281 131.238917)">orchestrator + 8 agents</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(130.961094 139.905246)">+ machines (see Part 1)</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(128.758828 148.038917)">about one day per lesson</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111827" x="286.2" y="118.825128" transform="rotate(-0 286.2 118.825128)">Shared files</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(265.3575 131.238917)">lesson.yaml</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(247.301328 140.317042)">maths module + tests</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(249.052969 148.038917)">video, captions, pack</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111827" x="399.195" y="118.825128" transform="rotate(-0 399.195 118.825128)">Website</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(363.102891 131.917042)">static HTML + KaTeX</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(365.829609 139.638917)">+ Three.js, built by</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(368.694141 147.941574)">web/build_site.py</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111827" x="512.19" y="118.825128" transform="rotate(-0 512.19 118.825128)">Learner</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(471.325859 131.238917)">story → maths → AI use</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(477.630234 139.638917)">→ industry example</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(475.634141 148.038917)">→ quiz → experiment</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111827" x="129.96" y="233.469499" transform="rotate(-0 129.96 233.469499)">Memory  (plain files, no vector database)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(31.593594 246.345202)">skill = how to work  ·  artifact store = the current lesson</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(32.693359 254.067077)">project memory = founder's rules, kept across sessions</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111827" x="411.75" y="233.469499" transform="rotate(-0 411.75 233.469499)">What is NOT used</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(299.47 245.667077)">no LangChain, no LangGraph, no vector RAG, no React, no CMS,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(333.675391 254.067077)">no image/video generators, no voice cloning</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b91c1c" x="286.2" y="12.670875" transform="rotate(-0 286.2 12.670875)">learner feedback and on-demand requests come back to the founder</text>
   </g>
